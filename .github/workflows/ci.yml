name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-ui-tests:
    name: Core and UI Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test Core
        run: dotnet test tests/CycloneNest2D.Tests/CycloneNest2D.Tests.csproj -c Release
      - name: Test UI Core
        run: dotnet test tests/CycloneNest2D.UI.Tests/CycloneNest2D.UI.Tests.csproj -c Release
      - name: Test DXF-to-export workflow (Windows)
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/CycloneNest2D.UI.Tests/CycloneNest2D.UI.Tests.csproj -c Release --filter "Category=EndToEnd"

  desktop-build:
    name: Desktop build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore CycloneNest2D.sln
      - name: Verify .NET formatting
        run: dotnet format CycloneNest2D.sln --verify-no-changes --no-restore
      - name: Build Desktop
        run: dotnet build src/CycloneNest2D.Desktop/CycloneNest2D.Desktop.csproj -c Release
      - name: Publish framework-dependent Windows x64 app
        run: dotnet publish src/CycloneNest2D.Desktop/CycloneNest2D.Desktop.csproj -c Release -r win-x64 --self-contained false --output artifacts/publish/win-x64
      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish/win-x64 -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) *$($_.Path.Substring((Resolve-Path artifacts/publish/win-x64).Path.Length + 1))" } |
            Set-Content artifacts/publish/SHA256SUMS.txt
      - name: Upload Windows x64 publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycloneNest2D-${{ github.sha }}-win-x64
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 30

  performance-quick:
    name: Quick performance report (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run quick benchmark
        run: dotnet run --project tests/CycloneNest2D.Performance/CycloneNest2D.Performance.csproj -c Release -- --quick --repeat 3 --max-seconds 1.5 --output artifacts/performance/quick
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: nesting-performance-quick
          path: artifacts/performance/quick.*
          if-no-files-found: error
          retention-days: 14
